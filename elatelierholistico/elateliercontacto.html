<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Contacto | Atelier Capacitaciones</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Estilos propios -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<link rel="stylesheet" href="css/estilos.css">
</head>
<body>

    <nav class="menu-principal">
        <a href="elatelierholistico-index.html">Inicio</a>
        <a href="elateliercursos.html">Cursos</a>
        <a href="elateliercontacto.html">Contacto</a>
    </nav>

    <header>
        <h1>Contactate con Atelier</h1>
        <p>Contanos qué te gustaría aprender.</p>
    </header>

    <main>
        <section>
            <h2>Envianos tu consulta</h2>

            <form action="#" method="get" class="formulario-contacto">
                <label for="nombre">Nombre y apellido:</label>
                <input type="text" id="nombre" name="nombre" class="campo-formulario" required>

                <br><br>

                <label for="email">Correo electrónico:</label>
                <input type="email" id="email" name="email" required>

                <br><br>

                <label for="mensaje">Mensaje:</label>
                <textarea id="mensaje" name="mensaje" rows="5" required></textarea>

                <br><br>

                <button type="submit"class="boton-principal">Enviar mensaje</button>
            </form>

            <p>Este formulario es demostrativo y no envía mensajes.</p>
        </section>
    </main>

    <footer>
        <p>© 2026 Atelier Capacitaciones</p>
    </footer>

</body>
</html>
